<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="680" height="130" role="graphics-document document" aria-roledescription="flowchart">
  <defs>
    <style>
      .flow-label { font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1d1d1f; text-anchor: middle; }
      .flow-sub   { font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 11px; fill: #444; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="130" rx="10" fill="#ffffff"/>

  <!-- Node 1: 發牌 16張 -->
  <rect x="20" y="35" width="130" height="54" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="2"/>
  <text x="85" y="57" class="flow-label">1. 發牌 16張</text>
  <text x="85" y="76" class="flow-sub">Deal 16 tiles</text>

  <!-- Arrow 1 → 2 -->
  <line x1="150" y1="62" x2="183" y2="62" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: 摸牌 / 吃牌 -->
  <rect x="185" y="35" width="148" height="54" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="2"/>
  <text x="259" y="57" class="flow-label">2. 摸牌 / 吃牌</text>
  <text x="259" y="76" class="flow-sub">Draw / Chi</text>

  <!-- Arrow 2 → 3 -->
  <line x1="333" y1="62" x2="366" y2="62" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: 出牌 -->
  <rect x="368" y="35" width="120" height="54" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="2"/>
  <text x="428" y="57" class="flow-label">3. 出牌</text>
  <text x="428" y="76" class="flow-sub">Discard</text>

  <!-- Arrow 3 → 4 -->
  <line x1="488" y1="62" x2="521" y2="62" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: 胡牌 (win style - green) -->
  <rect x="523" y="35" width="130" height="54" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="588" y="57" class="flow-label">4. 胡牌 🀄</text>
  <text x="588" y="76" class="flow-sub">Hu / Win!</text>

</svg>